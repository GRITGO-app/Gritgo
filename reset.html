<!DOCTYPE html>
<html>
<head><title>Resetting App...</title></head>
<body style="background:#0f1419; color:#00e5ff; font-family:sans-serif; text-align:center; padding-top:50px;">
  <h2>Resetting GRITGO... Please wait.</h2>
  <p id="status">Cleaning old cache...</p>
  <script>
    async function resetApp() {
      // ১. সব সার্ভিস ওয়ার্কার আনরেজিস্টার করা
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (let registration of registrations) {
          await registration.unregister();
        }
      }
      // ২. সব ক্যাশে ডিলিট করা
      if ('caches' in window) {
        const cacheNames = await caches.keys();
        for (let name of cacheNames) {
          await caches.delete(name);
        }
      }
      document.getElementById('status').innerHTML = "✅ All clean! <br><br> <b>Please CLOSE this tab and open GRITGO test.html again.</b>";
    }
    resetApp();
  </script>
</body>
</html>
